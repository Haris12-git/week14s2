name: wf-develop-pr
on:
  pull_request:
    branches:
      - develop
jobs:
  develop-pr-job:
    runs-on: ubuntu-latest
    steps:
    - name: checkoutrepo
      run: actions/checkout@v4
    - name: lint html and css
      run: |
        npx htmlhint "**/*.html"
        npx stylelint "**/*.css" 
    - name: Build Website
      run: npx parcel build "./src/index.html" --dist-dir "./dev"  --public-url "./"